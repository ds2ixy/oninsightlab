<style>
/* Layout: 남색 작업대 위에 펼친 슬라이드형 이북 한 권. 상단 툴바 · 화면에 맞춘 책 · 하단 쪽 슬라이더 */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;color-scheme:light;
  --desk:#DCE6F1; --desk-2:#EEF3F9;
  --bar:#FFFFFF; --bar-line:#D5DEEA;
  --ink:#0B1626; --ink-2:#334459; --ink-3:#63748C;
  --accent:#0071AE; --accent-fill:#008CD6; --accent-soft:#E2F0FB;
  --btn:#F3F6FA; --btn-on:#008CD6; --btn-on-ink:#FFFFFF;
  --shadow:0 22px 60px rgba(0,19,51,.28);
  --page-dim:1;
  --f-dsp:"Archivo","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  height:100%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#030A16; --desk-2:#0B1A2E; --bar:#0D1727; --bar-line:#22344B;
  --ink:#E7EEF7; --ink-2:#B9C7D9; --ink-3:#8A9DB5; --accent:#5CBEF0; --accent-soft:#0E2A3F;
  --btn:#132134; --btn-on:#5CBEF0; --btn-on-ink:#06101D; --shadow:0 22px 70px rgba(0,0,0,.7); --page-dim:.92; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#030A16; --desk-2:#0B1A2E; --bar:#0D1727; --bar-line:#22344B;
  --ink:#E7EEF7; --ink-2:#B9C7D9; --ink-3:#8A9DB5; --accent:#5CBEF0; --accent-soft:#0E2A3F;
  --btn:#132134; --btn-on:#5CBEF0; --btn-on-ink:#06101D; --shadow:0 22px 70px rgba(0,0,0,.7); --page-dim:.92; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;word-break:keep-all;background:radial-gradient(120% 90% at 50% 45%,var(--desk-2),var(--desk));color:var(--ink);font-family:var(--f-body);
  display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Toolbar */
.bar{position:relative;z-index:5;background:var(--bar);border-bottom:1px solid var(--bar-line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.brand img{height:28px;width:auto}
.brand .t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.brand b{font-family:var(--f-dsp);font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel{height:36px;border-radius:8px;border:1px solid var(--bar-line);background:var(--btn);padding:0 10px;max-width:280px;font-size:13.5px;cursor:pointer}
.seg{display:inline-flex;background:var(--btn);border:1px solid var(--bar-line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 10px;border-radius:7px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);font-weight:600}
.ib{height:36px;min-width:36px;border:1px solid var(--bar-line);background:var(--btn);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:13px;color:var(--ink)}
a.ib{text-decoration:none}
.ib.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff;font-weight:600}
.ib svg,.seg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Stage */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
#book .stf__item{box-shadow:var(--shadow)}
.page{background:#fff;overflow:hidden}
.page .ph{position:absolute;inset:0;background:#fff center/100% 100% no-repeat;filter:brightness(var(--page-dim))}
.page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s;filter:brightness(var(--page-dim));user-select:none;-webkit-user-drag:none}
.page img.on{opacity:1}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;
  background:color-mix(in srgb,var(--bar) 75%,transparent);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;backdrop-filter:blur(6px)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.nav.prev{left:max(10px,env(safe-area-inset-left,0px))}.nav.next{right:max(10px,env(safe-area-inset-right,0px))}
.nav:disabled{opacity:0;pointer-events:none}

/* Footer */
.foot{background:var(--bar);border-top:1px solid var(--bar-line);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.foot input[type=range]{flex:1;accent-color:var(--accent-fill);min-width:0}
.now{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.folio{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px;text-align:right}

/* Thumbnails (모아보기) */
.grid{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--desk) 96%,transparent);backdrop-filter:blur(4px);overflow:auto;
  padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.grid .wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.grid button{border:0;padding:0;background:none;cursor:pointer;text-align:left;display:grid;gap:6px}
.grid img{width:100%;aspect-ratio:1600/894;display:block;border-radius:6px;box-shadow:0 6px 18px rgba(0,19,51,.18);filter:brightness(var(--page-dim))}
.grid button[aria-current="true"] img{outline:3px solid var(--accent-fill);outline-offset:2px}
.grid span{font-size:12.5px;color:var(--ink-2)}
.grid span b{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:6px}
.grid .close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:21}

@media (max-width:760px){
  .brand span,.lbl{display:none}
  .sel{max-width:150px}
  .ctrls{gap:6px}
  .nav{width:34px;height:50px}
  .now{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <a class="ib" href="../index.html#archive" title="자료실로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">자료실</span></a>
  <div class="brand"><img src="../files/favicon.png" alt=""><div class="t"><b id="docTitle">브랜드 비전 체계</b><span id="docSub">On Insight Lab · 브랜드·CI</span></div></div>
  <div class="ctrls">
    <select id="jump" class="sel" aria-label="쪽으로 바로가기"></select>
    <button class="ib" id="gridBtn" title="모아보기"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/></svg><span class="lbl">모아보기</span></button>
    <div class="seg" role="group" aria-label="화면 밝기">
      <button id="tl" aria-pressed="true" title="밝게"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button id="td" aria-pressed="false" title="어둡게"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
    <a class="ib pri" id="pdfBtn" href="#" download title="PDF 내려받기"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">PDF</span></a>
  </div>
</header>

<main class="stage" id="stage">
  <button class="nav prev" id="prev" aria-label="이전 쪽"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="book"></div>
  <button class="nav next" id="next" aria-label="다음 쪽"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</main>

<footer class="foot">
  <span class="now" id="now"></span>
  <input type="range" id="slider" min="0" value="0" aria-label="쪽 이동">
  <span class="folio" id="folio">1 / 1</span>
</footer>

<div class="grid" id="grid" hidden>
  <button class="ib close" id="gridClose">닫기 ✕</button>
  <div class="wrap" id="gridWrap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
/* ───────── 이북 데이터: 새 이북을 만들 때는 이 블록만 바꾸면 됩니다 ───────── */
const BOOK = {
  title: "브랜드 비전 체계",
  sub:   "On Insight Lab · 브랜드·CI",
  pdf:   "../files/On_Insight_Lab_브랜드_비전체계.pdf",
  dir:   "brand-vision",
  count: 12,
  ratio: 1600/894,            /* 쪽 가로/세로 */
  toc: [                       /* [쪽, 제목] */
    [1,  "표지"],
    [2,  "Insight ON, Impact REAL."],
    [3,  "조형적 상징의 해체"],
    [4,  "색상에 담긴 철학"],
    [5,  "정밀한 통찰의 설계"],
    [6,  "비전 체계의 구조화"],
    [7,  "핵심가치 O-N-I 행동 원칙"],
    [8,  "4대 전략 방향"],
    [9,  "형태와 가치의 통합"],
    [10, "시그니처 시스템 · 적용 규정"],
    [11, "톤앤매너 · 브랜드 어플리케이션"],
    [12, "맺음"]
  ]
};
/* ─────────────────────────────────────────────────────────────── */

const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const pad=n=>String(n).padStart(2,"0");
const full=i=>`${BOOK.dir}/p${pad(i+1)}.jpg`, thumb=i=>`${BOOK.dir}/s/p${pad(i+1)}.jpg`;
const titleAt=i=>{let t="";BOOK.toc.forEach(x=>{if(i+1>=x[0])t=x[1]});return t};
let flip=null, cur=0;

$("#docTitle").textContent=BOOK.title; $("#docSub").textContent=BOOK.sub; $("#pdfBtn").href=BOOK.pdf;

function buildPages(){
  const els=[];
  for(let i=0;i<BOOK.count;i++){
    const p=document.createElement("div"); p.className="page"; if(i===0||i===BOOK.count-1) p.dataset.density="hard";
    p.innerHTML=`<div class="ph" style="background-image:url('${thumb(i)}')"></div><img data-n="${i}" alt="${BOOK.title} ${i+1}쪽 · ${titleAt(i)}" draggable="false">`;
    els.push(p);
  }
  return els;
}
function layout(){
  const st=$("#stage"), cs=getComputedStyle(st), narrow=innerWidth<760;
  const W=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-(narrow?0:120);
  const H=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let w=W, h=w/BOOK.ratio; if(h>H){h=H;w=h*BOOK.ratio}
  return {w:Math.floor(w),h:Math.floor(h)};
}
/* 지금 쪽부터 원본 이미지 순서대로 불러오기 */
let IMGS=[], queue=[], active=0; const LOADED=new Set();
function bindImgs(root){ IMGS=[]; root.querySelectorAll("img[data-n]").forEach(im=>{const n=+im.dataset.n; IMGS[n]=im; if(LOADED.has(n)){im.src=full(n);im.classList.add("on")}}); }
function pump(){ while(active<3&&queue.length){ const n=queue.shift(), im=IMGS[n]; if(!im||im.getAttribute("src")) continue;
  active++; im.onload=()=>{active--;LOADED.add(n);im.classList.add("on");pump()}; im.onerror=()=>{active--;pump()}; im.src=full(n); } }
function prioritize(i){ const o=[]; for(let d=0;d<BOOK.count;d++) [i+d,i-d].forEach(x=>{if(x>=0&&x<BOOK.count&&!o.includes(x))o.push(x)}); queue=o; pump(); }

function sync(i){
  cur=i; prioritize(i);
  $("#folio").textContent=`${i+1} / ${BOOK.count}`; $("#now").textContent=titleAt(i);
  $("#slider").value=i; $("#prev").disabled=i===0; $("#next").disabled=i>=BOOK.count-1;
  let v=0; BOOK.toc.forEach(x=>{if(i+1>=x[0])v=x[0]}); $("#jump").value=String(v);
  try{history.replaceState(null,"",i?`#p${i+1}`:location.pathname)}catch(e){}
}
function init(at){
  const host=$("#stage"); if(flip){try{flip.destroy()}catch(e){} flip=null}
  host.querySelectorAll("#book").forEach(b=>b.remove());
  const book=document.createElement("div"); book.id="book"; host.insertBefore(book,$("#next"));
  const {w,h}=layout(); book.style.width=w+"px"; book.style.height=h+"px";
  flip=new St.PageFlip(book,{width:w,height:h,size:"fixed",usePortrait:true,showCover:false,autoSize:false,
    maxShadowOpacity:.35,flippingTime:700,mobileScrollSupport:false,showPageCorners:true,drawShadow:true,startPage:at||0});
  flip.loadFromHTML(buildPages()); bindImgs(book);
  flip.on("flip",e=>sync(e.data)); sync(flip.getCurrentPageIndex());
}
function go(i){ if(!flip) return; i=Math.max(0,Math.min(BOOK.count-1,i)); if(i===cur) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){flip.turnToPage(i);sync(i)} else flip.flip(i); }

/* 컨트롤 */
$("#jump").innerHTML=BOOK.toc.map(x=>`<option value="${x[0]}">${pad(x[0])} · ${x[1]}</option>`).join("");
$("#jump").addEventListener("change",e=>go(+e.target.value-1));
$("#prev").onclick=()=>flip&&flip.flipPrev(); $("#next").onclick=()=>flip&&flip.flipNext();
const sl=$("#slider"); sl.max=BOOK.count-1; sl.addEventListener("input",()=>{flip.turnToPage(+sl.value);sync(+sl.value)});
document.addEventListener("keydown",e=>{
  if(!$("#grid").hidden){ if(e.key==="Escape") closeGrid(); return; }
  if(e.target.matches("select,input")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown") flip.flipNext();
  if(e.key==="ArrowLeft"||e.key==="PageUp") flip.flipPrev();
  if(e.key==="Home") go(0); if(e.key==="End") go(BOOK.count-1);
});
function openGrid(){
  const w=$("#gridWrap"); w.textContent="";
  for(let i=0;i<BOOK.count;i++){
    const b=document.createElement("button"); b.type="button"; if(i===cur) b.setAttribute("aria-current","true");
    b.innerHTML=`<img src="${thumb(i)}" alt="" loading="lazy"><span><b>${pad(i+1)}</b>${titleAt(i)}</span>`;
    b.onclick=()=>{closeGrid(); flip.turnToPage(i); sync(i)}; w.appendChild(b);
  }
  $("#grid").hidden=false; $("#gridClose").focus();
}
function closeGrid(){$("#grid").hidden=true;$("#gridBtn").focus()}
$("#gridBtn").onclick=openGrid; $("#gridClose").onclick=closeGrid;

function applyTheme(t){
  if(t) document.documentElement.dataset.theme=t;
  const eff=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  $("#tl").setAttribute("aria-pressed",eff==="light"); $("#td").setAttribute("aria-pressed",eff==="dark");
}
$("#tl").onclick=()=>{applyTheme("light");store.set("oil-ebook-theme","light")};
$("#td").onclick=()=>{applyTheme("dark");store.set("oil-ebook-theme","dark")};
applyTheme(store.get("oil-ebook-theme"));

let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>init(cur),180)});
const m=location.hash.match(/^#p(\d+)$/), start=m?Math.min(+m[1],BOOK.count)-1:0;
if(window.St) init(start); else $("#stage").innerHTML='<p style="color:var(--ink-2)">책 넘김 기능을 불러오지 못했습니다. 새로고침해 주세요.</p>';
</script>
</body>
