<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온인사이트랩 - 자료실</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; color: #1f2937; line-height: 1.5; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #111827; padding-bottom: 16px; margin-bottom: 24px; }
    h2 { margin: 0; font-size: 24px; font-weight: 700; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-secondary { background: #4b5563; }
    .btn-secondary:hover { background: #374151; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 14px 12px; text-align: left; }
    th { background: #f9fafb; font-weight: 600; font-size: 14px; color: #4b5563; }
    td { font-size: 14px; }
    .post-desc { color: #6b7280; font-size: 13px; margin-top: 6px; white-space: pre-wrap; }
    .file-badge { display: inline-block; background: #e0f2fe; color: #0284c7; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; text-decoration: none; transition: background 0.2s; }
    .file-badge:hover { background: #bae6fd; }

    /* 글쓰기 모달 창 */
    #writeModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
    .modal-box { background: #fff; width: 100%; max-width: 520px; margin: 60px auto; padding: 26px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    .modal-box h3 { margin-top: 0; margin-bottom: 20px; font-size: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: #2563eb; ring: 2px solid #93c5fd; }
    .form-hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
  </style>

  <!-- Firebase 연결 스크립트 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 회원님의 프로젝트 설정 정보가 등록되어 있습니다
    const firebaseConfig = {
      apiKey: "AiZaSyCyVKMRTt_yzF40yiV6oIEp6aYNYcq3n-I",
      authDomain: "oninsightlab-board.firebaseapp.com",
      projectId: "oninsightlab-board",
      storageBucket: "oninsightlab-board.firebasestorage.app",
      messagingSenderId: "246766231192",
      appId: "1:246766231192:web:40b384b99430b97ba2faed",
      measurementId: "G-3BE75KL1K2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 목록 불러오기
    async function loadPosts() {
      const tbody = document.getElementById("postList");
      try {
        const q = query(collection(db, "board"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        tbody.innerHTML = "";

        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color:#888;">등록된 자료가 없습니다. 첫 자료를 등록해보세요!</td></tr>`;
          return;
        }

        let index = snapshot.size;
        snapshot.forEach((doc) => {
          const data = doc.data();
          const date = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString() : "-";
          const fileHtml = data.linkUrl 
            ? `<a href="${data.linkUrl}" target="_blank" rel="noopener noreferrer" class="file-badge">🔗 자료열기</a>` 
            : `<span style="color:#9ca3af;">-</span>`;

          tbody.innerHTML += `
            <tr>
              <td style="text-align:center; color:#6b7280;">${index--}</td>
              <td>
                <strong style="font-size:15px;">${data.title}</strong>
                ${data.content ? `<div class="post-desc">${data.content}</div>` : ""}
              </td>
              <td>${data.author}</td>
              <td style="color:#6b7280;">${date}</td>
              <td style="text-align:center;">${fileHtml}</td>
            </tr>
          `;
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:#dc2626;">자료를 불러오는 중 오류가 발생했습니다: ${err.message}</td></tr>`;
      }
    }

    // 새 글 등록
    document.getElementById("postForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerText = "등록 중...";
      submitBtn.disabled = true;

      try {
        const title = document.getElementById("title").value;
        const author = document.getElementById("author").value;
        const content = document.getElementById("content").value;
        let linkUrl = document.getElementById("linkUrl").value.trim();

        // http나 https가 안 붙어있으면 자동으로 붙여줌
        if (linkUrl && !linkUrl.startsWith("http://") && !linkUrl.startsWith("https://")) {
          linkUrl = "https://" + linkUrl;
        }

        await addDoc(collection(db, "board"), {
          title,
          author,
          content,
          linkUrl,
          createdAt: serverTimestamp()
        });

        alert("자료가 성공적으로 등록되었습니다!");
        closeModal();
        document.getElementById("postForm").reset();
        loadPosts();
      } catch (error) {
        alert("등록 실패: " + error.message);
      } finally {
        submitBtn.innerText = "등록 완료";
        submitBtn.disabled = false;
      }
    });

    window.openModal = () => document.getElementById("writeModal").style.display = "block";
    window.closeModal = () => document.getElementById("writeModal").style.display = "none";

    loadPosts();
  </script>
</head>
<body>

  <div class="header">
    <h2>온인사이트랩 자료실</h2>
    <div>
      <a href="index.html" class="btn btn-secondary" style="margin-right: 8px;">홈으로</a>
      <button class="btn" onclick="openModal()">+ 새 자료 등록</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 8%; text-align:center;">번호</th>
        <th style="width: 52%;">자료 제목 및 안내</th>
        <th style="width: 14%;">작성자</th>
        <th style="width: 14%;">등록일</th>
        <th style="width: 12%; text-align:center;">자료 링크</th>
      </tr>
    </thead>
    <tbody id="postList">
      <tr><td colspan="5" style="text-align: center; padding: 30px;">자료를 불러오는 중입니다...</td></tr>
    </tbody>
  </table>

  <!-- 등록 팝업창 -->
  <div id="writeModal">
    <div class="modal-box">
      <h3>새 자료 등록하기</h3>
      <form id="postForm">
        <div class="form-group">
          <label>작성자 *</label>
          <input type="text" id="author" required placeholder="작성자 성함 또는 팀명">
        </div>
        <div class="form-group">
          <label>자료 제목 *</label>
          <input type="text" id="title" required placeholder="자료 제목을 입력하세요">
        </div>
        <div class="form-group">
          <label>설명 및 안내사항</label>
          <textarea id="content" rows="3" placeholder="자료에 대한 간략한 설명이나 이용 안내"></textarea>
        </div>
        <div class="form-group">
          <label>자료 링크 (구글 드라이브, 노션, 다운로드 링크 등)</label>
          <input type="text" id="linkUrl" placeholder="https://drive.google.com/...">
          <div class="form-hint">💡 구글 드라이브나 네이버 MYBOX 파일 공유 링크를 넣으시면 방문자가 바로 다운로드할 수 있습니다.</div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" style="background:#e5e7eb; color:#374151;" onclick="closeModal()">취소</button>
          <button type="submit" class="btn" id="submitBtn">등록 완료</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
